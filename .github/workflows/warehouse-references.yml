name: Refresh cricket identity reference data
on:
  workflow_dispatch:
  schedule:
    - cron: '20 6 * * 1'
  push:
    branches: [main]
    paths:
      - 'warehouse/**'
      - '.github/workflows/warehouse-references.yml'
permissions:
  contents: write
jobs:
  update-open-references:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and validate Cricsheet people and venue registers
        run: python -m warehouse.registers
      - uses: actions/upload-artifact@v4
        with:
          name: cricket-open-reference-database
          path: |
            warehouse/exports/identities.sqlite.gz
            warehouse/exports/identity_manifest.json
          retention-days: 60
      - name: Commit reusable licensed reference snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add warehouse/exports/identities.sqlite.gz warehouse/exports/identity_manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Data warehouse: refresh Cricsheet player and venue IDs'
            git pull --rebase origin main
            git push
          fi
