name: Audit Cricket Master source match-number coverage
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-source-inventory.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit-current-open-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test that source-number gaps are not falsely called official census
        run: python -m unittest tests.test_match_inventory -v
      - name: Retrieve durable, released, rights-cleared Cricsheet source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/raw
          gh release download cricket-master-2026-11-09-42707561618 --repo "$GITHUB_REPOSITORY" --pattern cricsheet-all-json.zip --dir data/raw
          mv data/raw/cricsheet-all-json.zip data/raw/all_json.zip
      - name: Build source-specific match-number coverage audit
        run: python -m warehouse.match_inventory --output warehouse/audits
      - name: Commit public source-only gap report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add warehouse/audits/match_inventory.json
          if ! git diff --cached --quiet; then
            git commit -m "Warehouse: audit source numbering gaps (not independent census)"
            git pull --rebase origin main
            git push
          fi
      - name: Preserve audit run evidence
        uses: actions/upload-artifact@v4
        with:
          name: cricket-source-match-number-audit
          path: warehouse/audits/match_inventory.json
          retention-days: 90
