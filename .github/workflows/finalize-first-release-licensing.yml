name: Finalize first open warehouse release attribution
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-first-release-licensing.yml'
permissions:
  contents: write
jobs:
  license-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add clear Cricsheet licensing notice to first immutable data release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="cricket-master-2026-11-09-42707561618"
          cp warehouse/LICENSE.md LICENSE-ATTRIBUTION.md
          gh release upload "$TAG" LICENSE-ATTRIBUTION.md --repo "$GITHUB_REPOSITORY" --clobber
          cat > /tmp/cricsheet-notice.md <<'EOF'
          **Open cricket data and transformed match databases from Cricsheet.org**, distributed under the **Open Data Commons Attribution License v1.0 (ODC-BY 1.0)**.
          
          - Original source: https://cricsheet.org/downloads/
          - Cricsheet licensing and attribution: https://cricsheet.org/licensing/
          - Legal license text: https://opendatacommons.org/licenses/by/1-0/
          - Transform: original JSON archives into normalized gender/decade SQLite event databases.
          - Includes original Cricsheet archive with source LICENSE.txt, the master manifest with source/output checksums, and a separate LICENSE-ATTRIBUTION.md notice.
          
          Source statement: 'Cricket data provided by Cricsheet.org under the Open Data Commons Attribution License (ODC-BY 1.0). Transformed and partitioned by Cricket Master Warehouse.'
          
          These data reflect **the matches Cricsheet publishes**, not a complete official international cricket census. Historical ESPN-derived innings are **excluded** from this release because their bulk-redistribution rights have not been verified.
          EOF
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file /tmp/cricsheet-notice.md
