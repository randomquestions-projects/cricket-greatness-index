name: Validate historical Test Greatness website
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-test-ui.yml'
      - 'site/assets/test-greatness.js'
      - 'site/test-greatness.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check front-end Javascript syntax
        run: node --check site/assets/test-greatness.js
      - name: Verify live data and rights-safe public model structure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          html=Path('site/test-greatness.html').read_text()
          assert '<script src="assets/test-greatness.js"></script>' in html
          assert Path('site/assets/test-greatness.js').exists()
          d=json.loads(Path('site/data/test-greatness.json').read_text())
          assert d["scorecardCommonDenominator"] and not d["modernOnlyFeaturesInPrimaryModel"]
          assert not d["historicalRawRowsRedistributed"]
          assert not d["certifiedAllTimeRanking"]
          assert d["qualifiedPlayers"]>=150
          assert {"Don Bradman","Virat Kohli","Sachin Tendulkar"}.issubset({x["name"] for x in d["players"]})
          print("Model ready:",d["qualifiedPlayers"],"eligible batters")
          r=json.loads(Path('site/data/report.json').read_text())
          assert r["historicalFocus"] == []
          assert 'test-greatness.html' in Path('site/index.html').read_text()
          PY
