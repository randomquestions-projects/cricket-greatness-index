name: Refresh international cricket records
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-data.yml'
      - 'tests/test_historical.py'
      - 'tests/test_scorecard_model.py'
      - 'pipeline/ledger.py'
      - 'pipeline/audit.py'
      - 'pipeline/publication.py'
      - 'pipeline/scorecard_model.py'
      - 'pipeline/format_greatness.py'
      - 'tests/test_format_greatness.py'
  workflow_dispatch:
  schedule:
    - cron: '35 5 * * 1'
permissions:
  contents: write
concurrency:
  group: cricket-batting-ranking-refresh
  cancel-in-progress: false
jobs:
  ingest-and-score:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate data processing
        run: python -m unittest discover -s tests -v
      - name: Download ORIGINAL men's international archives
        run: python -m pipeline.ingest --download
      - name: Download and import historical Test/ODI/T20I innings snapshots
        run: python -m pipeline.historical --download
      - name: Compute all-format greatness using the single era-comparable methodology
        run: python -m pipeline.format_greatness
      - name: Publish openly licensed modern match-explorer rows only
        run: python -m pipeline.publication
      - name: Reconcile retired batting careers against ICC totals
        run: python -m pipeline.reconcile
      - name: Generate coverage audit
        run: python -m pipeline.audit
      - name: Verify one canonical public model and no legacy output
        run: |
          python - <<'PY'
          import json,gzip
          from pathlib import Path
          site=Path('site')
          manifest=json.loads(Path('data/generated/manifest.json').read_text())
          assert manifest['matchCount']>=1000
          assert not (site/'data/report.json').exists()
          assert not (site/'data/bootstrap.js').exists()
          assert not (site/'data/focus.js').exists()
          assert not (site/'data/innings.csv.gz').exists()
          assert not (site/'standalone.html').exists()
          expected={'test':('Don Bradman','Sachin Tendulkar'),
                    'odi':('Viv Richards','Sachin Tendulkar'),
                    't20i':('Virat Kohli',)}
          for fmt,names in expected.items():
            d=json.loads((site/'data'/(fmt+'-greatness.json')).read_text())
            assert d['format']==fmt and d['scorecardCommonDenominator']
            assert not d['modernOnlyFeaturesInPrimaryModel']
            assert not d['certifiedAllTimeRanking']
            assert not d['historicalRawRowsRedistributed']
            assert d['qualifiedPlayers']>=30
            p={x['name'] for x in d['players']}
            assert any(n in p for n in names), (fmt,names)
          d=json.loads((site/'data/greatness-combined.json').read_text())
          assert not d['allTimeCertified'] and not d['publishedHistoricalInningsRows']
          assert len(d['combined']['test_odi'])>=20
          assert len(d['combined']['all_three'])>=5
          c=json.loads((site/'data/coverage-status.json').read_text())
          assert c['totalObservedMatches']>10000
          assert not c['historicalCompletenessCertified']
          assert not c['allTimeRankingPermitted']
          checks=json.loads((site/'data/career-reconciliation.json').read_text())
          assert checks['passingCareers']>=5
          with gzip.open(site/'data/innings.json.gz','rt') as f:
            modern=json.load(f)
          assert modern and all(r['source']=='Cricsheet ODC-BY 1.0' for r in modern)
          assert 'assets/app.js' in (site/'index.html').read_text()
          print('Canonical model and source-integrity checks passed:',manifest['matchCount'],'modern matches')
          PY
      - name: Commit validated derived data without merge conflicts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SNAP="$(mktemp -d)"
          cp -a site/data "$SNAP/site-data"
          cp data/coverage.md "$SNAP/coverage.md"
          BASE_SHA="$(git rev-parse HEAD)"
          # Rebase would conflict on regenerated large data outputs. Instead,
          # apply these already validated outputs on the latest remote tree.
          # Refuse to publish if the model code or tests changed during this run.
          for ATTEMPT in 1 2 3 4 5; do
            git fetch origin main
            if ! git diff --quiet "$BASE_SHA" origin/main -- pipeline/ tests/ .github/workflows/refresh-data.yml; then
              echo "Model or build code changed after checkout: skip stale results; latest code's workflow will rebuild."
              exit 0
            fi
            git reset --hard origin/main
            mkdir -p site/data data
            cp -a "$SNAP/site-data/." site/data/
            cp "$SNAP/coverage.md" data/coverage.md
            git add site/data/ data/coverage.md
            if git diff --cached --quiet; then
              echo "No changes in computed cricket outputs"
              exit 0
            fi
            git commit -m "Data: recompute source-backed batting rankings"
            if git push origin HEAD:main; then
              echo "Committed validated rankings from current model"
              exit 0
            fi
            echo "Concurrent push; retrying generated output on latest main"
            sleep 2
          done
          echo "Unable to safely publish source-backed data after five retries"
          exit 1
