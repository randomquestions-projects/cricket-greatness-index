name: Publish outputs-only Cricket Greatness Lab (GitHub Pages)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: cricket-output-only-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require a live, valid bounded results API before any public-site cutover
        env:
          API_BASE: ${{ vars.CRICKET_OUTPUTS_API_BASE }}
        run: |
          python - <<'PY'
          import json,os,re,time,urllib.error,urllib.request
          from urllib.parse import urlparse
          from pathlib import Path
          base=os.environ.get("API_BASE","").rstrip("/")
          uri=urlparse(base)
          assert uri.scheme=="https" and re.fullmatch(
              r"[a-z0-9-]+\.execute-api\.[a-z0-9-]+\.amazonaws\.com",uri.hostname or ""
          ) and uri.path in ("","/") and not uri.query and not uri.fragment, "Approved HTTPS API Gateway required"
          last_request=[0.0]
          def read(path):
              gap=.5-(time.monotonic()-last_request[0])
              if gap>0:time.sleep(gap)
              for attempt in range(3):
                  req=urllib.request.Request(base+path,headers={"Accept":"application/json"})
                  try:
                      with urllib.request.urlopen(req,timeout=18) as response:
                          assert response.status==200
                          assert response.headers.get_content_type()=="application/json"
                          body=response.read(450000)
                          assert len(body)<450000
                      last_request[0]=time.monotonic()
                      return json.loads(body)
                  except urllib.error.HTTPError as exc:
                      if exc.code!=429 or attempt==2:raise
                      time.sleep((attempt+1)*1.5)
              raise RuntimeError("Bounded API request unavailable")
          health=read("/v1/cricket/health")
          assert health.get("status")=="ok"
          bootstrap=read("/v1/cricket/bootstrap")
          assert bootstrap.get("schemaVersion")=="cricket-results-v1"
          assert all(bootstrap.get("leaders",{}).get(f) for f in ("test","odi","t20i"))
          ranked=read("/v1/cricket/rankings?format=test&page=0")
          assert ranked.get("items") and len(ranked["items"])<=40
          modern=read("/v1/cricket/matches?format=odi&page=0")
          assert isinstance(modern.get("items"),list) and modern.get("schemaVersion")=="cricket-explorer-v1"
          disciplines=read("/v1/cricket/disciplines")
          assert disciplines.get("schemaVersion")=="cricket-discipline-projection-v1"
          assert set(disciplines.get("disciplines",[]))=={"bowling","allrounder"}
          assert disciplines.get("historicalRestrictedSourcesIncluded") is False
          for discipline in ("bowling","allrounder"):
              for fmt in ("test","odi","t20i","test_odi","all_three"):
                  result=read("/v1/cricket/discipline-rankings?discipline="+discipline+"&format="+fmt+"&page=0")
                  assert result.get("schemaVersion")=="cricket-discipline-projection-v1"
                  assert result.get("format")==fmt and result.get("discipline")==discipline
                  assert 0<len(result.get("items",[]))<=40 and result.get("allTimeCertified") is False
              for fmt in ("test","odi","t20i"):
                  result=read("/v1/cricket/discipline-matches?discipline="+discipline+"&format="+fmt+"&page=0")
                  assert result.get("schemaVersion")=="cricket-discipline-matches-v1"
                  assert 0<len(result.get("items",[]))<=40
                  assert result.get("modernCricsheetOnly") is True
          print("Verified 3 disciplines × 5 rankings, bounded modern match summaries and existing batting before deployment.")
          config=Path("site/assets/config.js")
          assert 'window.CRICKET_OUTPUTS_API_BASE = "";' in config.read_text()
          config.write_text("/* Public API origin; no credentials or S3 paths. */\nwindow.CRICKET_OUTPUTS_API_BASE = "+json.dumps(base)+";\n")
          print("Bounded results and Match Explorer APIs passed. No raw DB endpoints used.")
          PY
      - name: Fail closed if any downloadable source or non-UI asset remains
        run: |
          python - <<'PY'
          from pathlib import Path
          site=Path("site")
          allowed={"index.html","test-greatness.html","format-greatness.html",
                   ".nojekyll","assets/styles.css","assets/app.js","assets/config.js"}
          present={p.relative_to(site).as_posix() for p in site.rglob("*") if p.is_file()}
          assert "index.html" in present and "assets/app.js" in present
          assert present<=allowed, f"Unapproved website assets: {sorted(present-allowed)}"
          assert not (site/"data").exists(), "Downloadable site/data is forbidden"
          js=(site/"assets/app.js").read_text()
          for blocked in ("data/innings.json.gz","data/test-greatness.json",
                          "data/odi-greatness.json","data/t20i-greatness.json"):
              assert blocked not in js, blocked
          print("Only HTML/CSS/JS UI assets; no data files deployed.")
          PY
      - name: Validate browser JavaScript syntax
        run: node --check site/assets/app.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
