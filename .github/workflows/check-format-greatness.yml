name: Validate unified cricket research platform
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/index.html'
      - 'site/assets/**'
      - 'site/data/**'
      - 'pipeline/**'
      - 'tests/**'
      - 'site/test-greatness.html'
      - 'site/format-greatness.html'
      - '.github/workflows/check-format-greatness.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Python source ledger and unified model tests
        run: python -m unittest discover -s tests -v
      - name: Browser-like smoke test with the real published source JSON
        run: |
          npm install --no-save --no-package-lock jsdom@26
          node tests/site_smoke.mjs
      - name: Validate one-page website and fail if legacy outputs resurface
        run: |
          node --check site/assets/app.js
          python - <<'PY'
          import json
          from pathlib import Path
          site=Path('site')
          html=(site/'index.html').read_text()
          assert '<script defer src="assets/app.js"></script>' in html
          assert 'bootstrap.js' not in html and 'focus.js' not in html
          assert not (site/'assets/format-greatness.js').exists()
          assert not (site/'assets/test-greatness.js').exists()
          assert not (site/'data/bootstrap.js').exists()
          assert not (site/'data/report.json').exists()
          assert not (site/'data/focus-innings.json').exists()
          assert not (site/'data/focus.js').exists()
          assert not (site/'data/innings.csv.gz').exists()
          assert not (site/'standalone.html').exists()
          assert not Path('pipeline/model.py').exists()
          assert not Path('pipeline/standalone.py').exists()
          for f in ('overview','test','odi','t20i','test_odi','all_three','compare','matches','methodology','coverage'):
            assert 'href="#'+f+'"' in html, f
          script=(site/'assets/app.js').read_text()
          assert 'data/innings.json.gz' in script
          assert 'data/'+ 'report.json' not in script
          assert 'function overview()' in script
          assert 'function methodology()' in script
          for f in ('test','odi','t20i'):
            d=json.loads((site/'data'/(f+'-greatness.json')).read_text())
            assert d['format']==f and d['scorecardCommonDenominator']
            assert not d['modernOnlyFeaturesInPrimaryModel']
            assert d['qualifiedPlayers']>100
          d=json.loads((site/'data/greatness-combined.json').read_text())
          assert d['combined']['test_odi'] and d['combined']['all_three']
          assert not d['allTimeCertified']
          for p in ('site/test-greatness.html','site/format-greatness.html'):
            s=Path(p).read_text()
            assert 'index.html#' in s
            assert 'g-layout' not in s and 'test-layout' not in s
          print('Unified site passed: one app, one model, 10 views, no legacy ranking reports')
          PY
