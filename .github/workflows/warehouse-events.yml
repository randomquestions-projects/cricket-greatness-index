name: Build reusable international cricket event warehouse
on:
  workflow_dispatch:
  schedule:
    - cron: '45 7 * * 1'
  push:
    branches: [main]
    paths:
      - 'warehouse/events.py'
      - 'tests/test_warehouse.py'
      - '.github/workflows/warehouse-events.yml'
permissions:
  contents: write
jobs:
  event-database:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Warehouse parsing and referential-integrity tests
        run: python -m unittest tests.test_warehouse -v
      - name: Download current original deliveries and construct immutable-event warehouse snapshot
        run: python -m warehouse.events --download
      - name: Validate full source inventory
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('warehouse/exports/events_manifest.json').read_text())
          assert sum(v for k,v in x['counts'].items() if k.endswith('_matches'))>=5000
          assert sum(v for k,v in x['counts'].items() if k.endswith('_deliveries'))>=100000
          assert x['archiveSHA256']
          print(x['counts'])
          PY
      - name: Expose queryable delivery-level warehouse snapshot
        uses: actions/upload-artifact@v4
        with:
          name: cricket-international-delivery-warehouse
          path: |
            warehouse/exports/cricket-events.sqlite.gz
            warehouse/exports/events_manifest.json
          retention-days: 60
          compression-level: 0
      - name: Commit lightweight source-backed manifest (not the multi-GB database)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add warehouse/exports/events_manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Data warehouse: record updated delivery archive coverage'
            git pull --rebase origin main
            git push
          fi
